<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Title</title>
  <link rel="stylesheet" href="index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<script src="https://unpkg.com/lucide@latest"></script>

<body>
  <div id="main_parent">
    <div id="first-container">

    </div>
    <div id="icon-house">
      <div>
        <i class="ico-base" id="square" data-lucide="square"></i>
      </div>
      <div>
        <i class="ico-base" id="triangle" data-lucide="triangle"></i>
      </div>
      <div>
        <i class="ico-base" id="rectangle" data-lucide="rectangle-horizontal"></i>
      </div>
      <div>
        <i class="ico-base" id="circle" data-lucide="circle"></i>
      </div>
      <div>
        <i class="ico-base" id="pen" data-lucide="pen"></i>
      </div>
      <div>
        <i class="ico-base" id="line" data-lucide="line-dot-right-horizontal"></i>
      </div>
      <div>
        <i class="ico-base" id="eraser" data-lucide="eraser"></i>
      </div>
      <div>
        <i class="ico-base" id="text" data-lucide="type-outline"></i>
      </div>
      <div>
        <i class="ico-base" id="select" data-lucide="square-dashed"></i>
      </div>
      <div>
        <input type="color" id="color_s" value="#000000">
      </div>
      <div id="wbox">
        <label for="swi" class="jb-font" style="color: var(--can-col);">Width:</label>
        <input type="range" id="swi" min="1" max="20" value="2" style="width:90px;cursor:pointer;">
      </div>
      <div id="wbox">
        <label for="scale"  class="jb-font" style="color: var(--can-col);">Scale:</label>
        <input type="range" id="scale" min="0" max="5" value="1" style="width:90px;cursor:pointer;">
      </div>
      <div id="wbox">
        <label for="angle" class="jb-font" style="color: var(--can-col);">Angle:</label>
        <input type="number" id="angle" min="0" max="360" value="0" style="width:90px;cursor:pointer;">
      </div>
      <div>
        <i class="ico-base" id="dark_mode" data-lucide="moon"></i>

      </div>
      <div>
        <i class="ico-base" id="clear" data-lucide="trash"></i>
      </div>
    </div>

    <canvas id="can"></canvas>

  </div>
  <script>lucide.createIcons();</script>

  <script src="setup.js"></script>
  <script src="helpers.js"></script>
  <script src="rendering.js"></script>
  <script src="mouse.js"></script>
  <script src="main.js"></script>
<!--  <script src="interaction-events.js"></script>-->
</body>

</html>
